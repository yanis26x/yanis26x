<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bleed4Me</title>
  <style>
    :root{
      --bg1:#9be3a1; /* prairie */
      --bg2:#6dc08b; /* arbres */
      --sky:#fffcff; /* plus lumineux */
      --sand:#f7e7b1;
      --sea:#89c7ff;
      --panel:#fff7fb;
      --panel-edge:#f2d4e6;
      --text:#2a2a2a;
      --accent:#ff5c93; /* kitty */
      --accent2:#ffd1e6;
    }
    *{box-sizing:border-box}
    html,body{height:100%;}
    body{
      margin:0; font-family: ui-rounded, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      color:var(--text); background:var(--sky);
      overflow:hidden;
    }
    .game{ position:relative; height:100%; width:100%; }
    /* --- Background layers --- */
    .bg{position:absolute; inset:0; overflow:hidden;}
    .layer-sky{position:absolute; top:0; left:0; right:0; height:55%; background:linear-gradient(#fff, var(--sky));}
    .layer-sea{position:absolute; top:55%; left:0; right:0; height:12%; background:linear-gradient(var(--sea), #63b4fd); overflow:hidden}
    .layer-sea::before{content:""; position:absolute; inset:0; background:repeating-linear-gradient( to right, rgba(255,255,255,.35) 0 6px, rgba(255,255,255,0) 6px 28px);
      opacity:.35; transform:translateX(0); animation: waves 18s linear infinite;}
    @keyframes waves{ to{ transform:translateX(-300px);} }
    .layer-sand{position:absolute; top:67%; left:0; right:0; height:8%; background:radial-gradient(160% 100% at 50% 0%, var(--sand) 0 60%, #e8d9a3 70%);} 
    .layer-grass{position:absolute; top:75%; left:0; right:0; bottom:0; background:linear-gradient(180deg, var(--bg1), var(--bg2));}

    .trees{position:absolute; inset:0; pointer-events:none; opacity:.9;}

    /* --- Character (SVG) --- */
    .npc{ position:absolute; left:50%; transform:translateX(-50%); bottom:22vh; width:min(42vh, 48vw); height:auto; aspect-ratio:1/1; filter: drop-shadow(0 10px 8px rgba(0,0,0,.25)); animation: floaty 3s ease-in-out infinite; }
    @keyframes floaty{ 0%,100%{transform:translate(-50%,0)} 50%{transform:translate(-50%,-6px)} }

    /* --- Dialogue panel --- */
    .dialogue{
      position:absolute; left:50%; transform:translateX(-50%);
      bottom:3vh; width:min(980px, 92vw);
      background:var(--panel);
      border:6px solid var(--panel-edge);
      border-bottom-width:10px; border-radius:30px;
      box-shadow: 0 16px 0 #cdbf9e, 0 28px 40px rgba(0,0,0,.25);
      padding:18px 20px 16px 20px;
    }
    .nameplate{ display:block; padding:0; margin:-34px 0 10px 14px; background:transparent; border:none; border-radius:0; color:#6a2443; font-weight:900; letter-spacing:.3px; text-transform:capitalize; box-shadow:none; font-size:clamp(20px,2.6vw,26px); }
    .text{ min-height:64px; line-height:1.5; font-size: clamp(16px, 2.2vw, 20px); padding:8px 6px 6px 6px; font-weight:600; word-spacing:1px; }
    .cursor{display:inline-block; width:10px; height:18px; background:var(--accent); border-radius:3px; margin-left:6px; animation:blink .9s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}

    .hud{ display:flex; gap:10px; align-items:center; justify-content:space-between; margin-top:8px; }
    .choices{display:flex; flex-wrap:wrap; gap:10px;}
    .choice{
      border:3px solid #3b7a2a; background:linear-gradient(180deg, #bff0b6, #7ddc75);
      color:#103612; padding:10px 14px; border-radius:16px; font-weight:800; cursor:pointer;
      transform:translateY(0); box-shadow:0 6px 0 #2b6120; user-select:none;
    }
    .choice:hover{filter:brightness(1.05)}
    .choice:active{transform:translateY(3px); box-shadow:0 3px 0 #2b6120}

    .hint{font-size:14px; color:#4b4b4b; opacity:.9; display:flex; align-items:center; gap:8px;}

    /* Mobile safe area */
    @media (max-width: 560px){ .npc{bottom:28vh;} .dialogue{bottom:2vh;} }

    .credit{position:absolute; right:10px; top:10px; background:rgba(255,255,255,.6); padding:6px 10px; border-radius:12px; font-size:12px}
    /* clouds */
    .clouds{position:absolute; inset:0; pointer-events:none;}
    .cloud{position:absolute; width:160px; height:70px; background:rgba(255,255,255,.95); border-radius:50px; filter: drop-shadow(0 6px 4px rgba(0,0,0,.18)); opacity:.9; animation: drift var(--dur, 40s) linear infinite;}
    .cloud::before,.cloud::after{content:""; position:absolute; background:inherit; border-radius:inherit;}
    .cloud::before{width:90px; height:90px; left:20px; top:-26px}
    .cloud::after{width:120px; height:80px; right:10px; top:-18px}
    @keyframes drift{ from{ transform:translateX(-20vw)} to{ transform:translateX(120vw)} }
    .clouds .cloud:nth-child(1){ top:8%; --dur:48s; animation-delay:-10s }
    .clouds .cloud:nth-child(2){ top:18%; --dur:62s; animation-delay:-30s; transform:scale(1.1)}
    .clouds .cloud:nth-child(3){ top:26%; --dur:38s; animation-delay:-18s; transform:scale(.85)}
    .clouds .cloud:nth-child(4){ top:12%; --dur:80s; animation-delay:-12s; transform:scale(1.3)}
    .clouds .cloud:nth-child(5){ top:30%; --dur:55s; animation-delay:-44s }
    .clouds .cloud:nth-child(6){ top:22%; --dur:68s; transform:scale(1.2)}

    /* petals */
    #petals{position:absolute; inset:0; pointer-events:none; overflow:hidden}
    .petal{position:absolute; width:16px; height:12px; background:radial-gradient(ellipse at 60% 40%, #ffe1ee 0 50%, #ffb3cf 55% 100%); border-radius:60% 60% 60% 60% / 80% 80% 40% 40%; opacity:.9; transform:translate3d(0,-10%,0) rotate(0deg); animation: fall var(--fall,12s) linear forwards, spin var(--spin,6s) ease-in-out infinite alternate;}
    @keyframes fall{ to{ transform:translate3d(0,110vh,0) rotate(360deg); opacity:.95}}
    @keyframes spin{ from{ transform:rotate(-20deg)} to{ transform:rotate(20deg)} }

    /* gentle camera sway */
    .game{animation: sway 12s ease-in-out infinite}
    @keyframes sway{ 50%{ transform: translateY(-2px)} }
  </style>
</head>
<body>
  <div class="game">
    <div class="bg" aria-hidden="true">
      <div class="layer-sky"></div>
      <div class="layer-sea"></div>
      <div class="layer-sand"></div>
      <div class="layer-grass"></div>
      <!-- drifting clouds -->
      <div class="clouds" aria-hidden="true">
        <span class="cloud"></span>
        <span class="cloud"></span>
        <span class="cloud"></span>
        <span class="cloud"></span>
        <span class="cloud"></span>
        <span class="cloud"></span>
      </div>
      <!-- falling petals container -->
      <div id="petals" aria-hidden="true"></div>
      <!-- Decorative SVG trees -->
      <svg class="trees" viewBox="0 0 100 100" preserveAspectRatio="none">
        <defs>
          <g id="tree">
            <circle cx="0" cy="0" r="6" fill="#4aa34c"/>
            <circle cx="-4" cy="-4" r="5" fill="#5fbf5e"/>
            <circle cx="4" cy="-3" r="4.5" fill="#66c96a"/>
            <rect x="-0.7" y="6" width="1.4" height="8" fill="#6b4c2a"/>
          </g>
        </defs>
        <g opacity=".7">
          <use href="#tree" x="10" y="70"></use>
          <use href="#tree" x="20" y="74" transform="scale(1.2)"></use>
          <use href="#tree" x="30" y="72"></use>
          <use href="#tree" x="40" y="78" transform="scale(1.3)"></use>
          <use href="#tree" x="50" y="73"></use>
          <use href="#tree" x="60" y="76" transform="scale(1.15)"></use>
          <use href="#tree" x="70" y="74"></use>
          <use href="#tree" x="80" y="79" transform="scale(1.25)"></use>
          <use href="#tree" x="90" y="73"></use>
        </g>
      </svg>
    </div>

    <!-- Hello Kitty-style (SVG, no external images) -->
    <svg class="npc" viewBox="0 0 200 200" aria-label="Hello Kitty style character" vector-effect="non-scaling-stroke">
      <ellipse cx="100" cy="178" rx="56" ry="14" fill="rgba(0,0,0,.18)" />
      <g stroke="#e5e5e5" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
        <circle cx="100" cy="90" r="62" fill="#ffffff" />
        <path d="M55 52 c-4 14 10 20 22 18 c5 -1 9 -6 8 -11 c-3 -13 21 -17 30 -7z" fill="#fff"/>
        <path d="M145 52 c4 14 -10 20 -22 18 c-5 -1 -9 -6 -8 -11 c3 -13 -21 -17 -30 -7z" fill="#fff"/>
        <g transform="translate(76,50)">
          <circle cx="0" cy="0" r="10" fill="#ff5c93" stroke="#c43968"/>
          <ellipse cx="-15" cy="0" rx="11" ry="14" fill="#ff85ae" stroke="#c43968"/>
          <ellipse cx="15" cy="0" rx="11" ry="14" fill="#ff85ae" stroke="#c43968"/>
        </g>
        <ellipse cx="84" cy="92" rx="5.5" ry="7.5" fill="#222" stroke="none"/>
        <ellipse cx="116" cy="92" rx="5.5" ry="7.5" fill="#222" stroke="none"/>
        <ellipse cx="100" cy="106" rx="6.5" ry="5" fill="#ffcf3c" stroke="#e0b41e"/>
        <path d="M60 98 h22" stroke="#222"/><path d="M60 106 h22" stroke="#222"/><path d="M60 114 h22" stroke="#222"/>
        <path d="M140 98 h-22" stroke="#222"/><path d="M140 106 h-22" stroke="#222"/><path d="M140 114 h-22" stroke="#222"/>
      </g>
      <g stroke="#e595b3" stroke-width="4.5" stroke-linejoin="round">
        <path d="M58 138 q42 26 84 0 v36 q-42 26 -84 0z" fill="#ffc1d9"/>
        <rect x="92" y="140" width="16" height="28" rx="5" fill="#ffffff" opacity=".85" stroke="none"/>
      </g>
    </svg>

    <!-- Dialogue panel -->
    <div class="dialogue" role="dialog" aria-live="polite">
      <div class="nameplate" id="name">Hello Kitty</div>
      <div id="text" class="text"></div>
      <div class="hud">
        <div id="choices" class="choices" aria-label="Choix"></div>
        <div class="hint">Appuie 1/2 · R pour recommencer· please dont hurt me  </div>
      </div>
    </div>

    <div class="credit">Im tired idk why i did this..</div>
  </div>

  <!-- BACKGROUND MUSIC (loop + autoplay-friendly) -->
  <audio id="bgm" src="bgm.mp3" preload="auto" loop playsinline></audio>

  <script>
    // =========================
    // Scenario
    // =========================
    const DIALOGUE = {
      start: {
        speaker: "Hello Kitty",
        text: `can U run me yo blood ?`,
        choices: [
          { label: "umm ok?", next: "ok_story" },
          { label: "Fuck No", next: "no_song" }
        ]
      },
      // Common preface: always spoken before branching content
      bleed: { speaker: "Hello Kitty", text: `Bleed 4 me` },

      // Path A — friendly story (contient du texte dark pour l'ambiance horreur)
      ok_story: {
        speaker: "Hello Kitty",
        text: `Thank you! You're so sweet. So, my day? I woke up early, tied my favorite bow, baked tiny heart-cookies, i will commit suici , im tired of living, cant do nun without drugs and picked petals by the beach. I love gentle mornings, sketching ribbons, and writing postcards to friends. Maybe later I’ll host a tea picnic with strawberry milk and sof90mg it songs.`,
        choices: [
          { label: "Préparer le pique-nique", next: "picnic" },
          { label: "Se balader sous les cerisiers", next: "walk" }
        ]
      },

      // Path B — censored song
      no_song: {
        speaker: "Hello Kitty",
        text: `Okay! I’ll sing a bleeped tune instead
Ayy, w***up, hey— [bleep]
C****d C*******z on the beat— we keep it neat
C***a in my cup, I’m lean— just kidding, it’s tea
[producer tag bleeped — la-la-la, meow-meow, beep-bee-eep]

Baby, C***a— pour a four? Nah, pour some peach tea
S***k pack got me sleepy— nah, clouds are just dreamy
dope-s***? No way— I’m clean, breathing easy
Skittles? Tasting rainbows— vibe feeling breezy
Sprinkle-sprinkle in the blunt? Nah, sprinkle confetti
Bad thoughts in my head? Poof— gone already
Bank-bankrolls expanding— pockets look hefty
Test me? You can’t beat me— I’m too steady
S** energy peaking— uh, switch it to cheery
Told her that I love her— okay, keep it friendly
R*** weed? We keep it legal— freebies
S** me? Nah— keep it PG, please
Yes-yes, good vibes only— never too sneaky
Can’t trust a b****?— beep— we keep it peachy
Money-money’s tempting— but kindness feeds me
Guap satisfaction? Meh— hearts complete me
Money-money around me— but not clingy
Mantras on my mind— staying zen, living easy
Lean blunts? No thanks— Pocky sticks crispy
BOOG-BOOGIE— confidence high, feeling nifty
Thought we were homies— if you finesse me— [bleep] it, forgive, see?
P***y won’t press me— we not stressing
Bad-bad vibes exit— we not sweating
Soon as I— [bleep-bleep]— okay, we’re ending!

la-la meow-meow • pink skies over sea • be kind, stay sweet • that’s the energy ✨`,
        choices: [
          { label: "Aller à la boutique rubans", next: "shop" },
          { label: "Chiller à la plage", next: "beach" }
        ]
      },

      picnic: { speaker: "Hello Kitty", text: `On déplie la nappe rose à pois ! Tu t'occupes des fraises ou des biscuits cœur ?`, choices:[ {label:"Fraises", next:"wrap"},{label:"Biscuits", next:"wrap"} ] },
      walk:   { speaker: "Hello Kitty", text: `Écoute le vent… les pétales dansent. Tu veux qu’on cueille quelques fleurs ?`, choices:[ {label:"Oui", next:"wrap"},{label:"Non, continuons", next:"wrap"} ] },
      shop:   { speaker: "Hello Kitty", text: `i will commit suici ,im tired of living, cant do nun without drugs, By333 By333! `, choices:[ {label:"Rose bonbon", next:"wrap"},{label:"Bleu ciel", next:"wrap"} ] },
      beach:  { speaker: "Hello Kitty", text: `Le bruit des vagues est apaisant. Château de sable ou sieste au soleil ?`, choices:[ {label:"Château", next:"wrap"},{label:"Sieste", next:"wrap"} ] },

      wrap: { speaker: "Hello Kitty", text: `Quelle jolie journée ! on pourra continuer plus tard. appuie sur R si tu veux recommencer une autre histoire ✨`, restart:true }
    };

    // =========================
    // Simple runtime tests ("test cases")
    // =========================
    (function runTests(){
      const ok = [];
      ok.push(()=> console.assert(!!DIALOGUE.start, 'Test: start node exists'));
      ok.push(()=> console.assert(Array.isArray(DIALOGUE.start.choices) && DIALOGUE.start.choices.length === 2, 'Test: start has two choices'));
      ok.push(()=> console.assert(!!DIALOGUE.bleed && !DIALOGUE.bleed.choices, 'Test: bleed node exists and has no choices'));
      ok.push(()=> console.assert(!!DIALOGUE.ok_story && !!DIALOGUE.no_song, 'Test: branch nodes exist'));
      ok.push(()=> console.assert(document.getElementById('bgm') instanceof HTMLAudioElement, 'Test: bgm element exists'));
      ok.push(()=> console.assert(document.getElementById('bgm').loop === true, 'Test: bgm is looping'));
      ok.forEach(f=>f());
    })();

    // =========================
    // DOM & State
    // =========================
    const nameEl = document.getElementById('name');
    const textEl = document.getElementById('text');
    const choicesEl = document.getElementById('choices');
    const bgm = document.getElementById('bgm');

    let current = 'start';
    let typing = false;    // empêche de skipper pendant l’animation
    let audioReady = false; // déverrouiller AudioContext après 1er input
    let pendingNext = null; // dynamic jump after 'bleed' preface

    // =========================
    // Audio ("Animalese")
    // =========================
    const AudioEngine = (()=>{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      let master = ctx.createGain(); master.gain.value = 0.25; master.connect(ctx.destination);
      const letterToPitch = (ch)=>{
        const c = ch.toLowerCase();
        if ("aeiouyàâäéèêëîïôöùûü".includes(c)) return 180 + Math.random()*30;
        if (",.;:!?".includes(c)) return 140 + Math.random()*20;
        return 260 + Math.random()*120;
      };
      const speakChar = (ch, dur=0.035)=>{
        const t = ctx.currentTime;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'square';
        osc.frequency.value = letterToPitch(ch);
        g.gain.setValueAtTime(0.001, t);
        g.gain.linearRampToValueAtTime(0.20, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(g).connect(master);
        osc.start(t); osc.stop(t + dur + 0.01);
      };
      const resume = ()=> ctx.state === 'suspended' ? ctx.resume() : Promise.resolve();
      return { speakChar, resume };
    })();

    // =========================
    // Typewriter (+ ducking BGM)
    // =========================
    function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

    function rampVolume(target, ms=200){
      if (!bgm) return;
      const start = bgm.volume;
      const steps = Math.max(1, Math.round(ms/30));
      let n = 0;
      const id = setInterval(()=>{
        n++;
        bgm.volume = start + (target - start) * (n/steps);
        if (n >= steps) clearInterval(id);
      }, 30);
    }

    const BGM_BASE_VISIBLE = 0.4;
    const BGM_BASE_HIDDEN  = 0.05;
    let bgmBase = BGM_BASE_VISIBLE;

    async function typeText(s){
      typing = true;
      // duck
      rampVolume(Math.max(0.15, bgmBase*0.45), 140);
      textEl.innerHTML = '';
      for (let i=0;i<s.length;i++){
        const ch = s[i];
        textEl.append(ch === '\n' ? document.createElement('br') : document.createTextNode(ch));
        if (audioReady && ch.trim()) AudioEngine.speakChar(ch);
        await wait(22 + Math.random()*20);
      }
      const caret = document.createElement('span');
      caret.className = 'cursor';
      textEl.appendChild(caret);
      typing = false;
      // unduck
      rampVolume(bgmBase, 220);
    }

    // =========================
    // Rendering & Flow
    // =========================
    async function showNode(key){
      current = key;
      const node = DIALOGUE[key];
      nameEl.textContent = node.speaker || '???';
      choicesEl.innerHTML = '';
      await typeText(node.text || '');

      // Auto-advance after the common preface
      if (key === 'bleed' && pendingNext){
        const target = pendingNext; pendingNext = null;
        setTimeout(()=> showNode(target), 450);
        return;
      }

      if (node.choices){
        node.choices.forEach((c, idx)=>{
          const b = document.createElement('button');
          b.className = 'choice';
          b.textContent = (idx+1)+'. ' + c.label;
          b.addEventListener('click', ()=> choose(idx));
          choicesEl.appendChild(b);
        });
      } else if (node.restart){
        const r = document.createElement('button');
        r.className='choice';
        r.textContent='Recommencer (R)';
        r.addEventListener('click', restart);
        choicesEl.appendChild(r);
      }
    }

    function choose(i){
      const node = DIALOGUE[current];
      if (!node.choices) return;
      const choice = node.choices[i];
      if (!choice) return;
      // Jumpscare sting si "Fuck No" -> no_song
      if (choice.next === 'no_song') setTimeout(sting, 100);
      // Always say 'Bleed 4 me' before going to the chosen content
      pendingNext = choice.next;
      showNode('bleed');
    }

    function restart(){ showNode('start'); }

    // =========================
    // BACKGROUND MUSIC: autoplay + fade-in + fallbacks
    // =========================
    (function setupBGM(){
      if (!bgm) return;

      // base volume selon visibilité
      bgmBase = document.hidden ? BGM_BASE_HIDDEN : BGM_BASE_VISIBLE;
      bgm.volume = 0;
      bgm.loop = true;

      function fadeIn(){
        rampVolume(bgmBase, 3000); // fade-in 3s
      }

      function tryPlay(){
        bgm.play()
          .then(()=> setTimeout(fadeIn, 300))
          .catch(()=> {
            // Autoplay bloqué -> on attend la première interaction
            const resume = ()=>{
              bgm.play().then(()=> fadeIn()).catch(()=>{/* noop */});
              window.removeEventListener('pointerdown', resume);
              window.removeEventListener('keydown', resume);
            };
            window.addEventListener('pointerdown', resume, { once:true });
            window.addEventListener('keydown', resume, { once:true });
          });
      }

      window.addEventListener('load', tryPlay);

      // baisse auto quand onglet caché
      document.addEventListener('visibilitychange', ()=>{
        bgmBase = document.hidden ? BGM_BASE_HIDDEN : BGM_BASE_VISIBLE;
        rampVolume(bgmBase, 300);
      });
    })();

    // =========================
    // Input bindings
    // =========================
    async function unlockAudio(){ if (!audioReady){ audioReady = true; await AudioEngine.resume(); } }
    document.addEventListener('pointerdown', unlockAudio, { once:false });
    document.addEventListener('keydown', (e)=>{
      if (!audioReady) AudioEngine.resume().then(()=>{ audioReady = true; });
      if (e.key.toLowerCase() === 'r') restart();
      
      if (/^[1-9]$/.test(e.key)) choose(parseInt(e.key,10)-1);
    });

    // =========================
    // Jumpscare sting (bruit bref)
    // =========================
    function sting(){
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain(), n = ctx.createBufferSource();
      // bruit / souffle court
      const buffer = ctx.createBuffer(1, ctx.sampleRate * 0.25, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1 - i/data.length);
      n.buffer = buffer;

      o.type = 'triangle';
      o.frequency.setValueAtTime(180, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.25);

      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.6, ctx.currentTime + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.32);

      n.connect(g); o.connect(g); g.connect(ctx.destination);
      n.start(); o.start(); o.stop(ctx.currentTime + 0.33);
    }

    // =========================
    // Extras: petals + parallax
    // =========================
    function initPetals(){
      const wrap = document.getElementById('petals');
      const N = 30;
      for(let i=0;i<N;i++) spawn();
      function spawn(){
        const p = document.createElement('span'); p.className='petal';
        p.style.left = Math.random()*100 + 'vw';
        p.style.top = (-10 - Math.random()*40) + 'vh';
        p.style.setProperty('--fall', (10+Math.random()*10)+'s');
        p.style.setProperty('--spin', (4+Math.random()*6)+'s');
        wrap.appendChild(p);
        p.addEventListener('animationend', ()=>{ p.remove(); spawn(); });
      }
    }

    (function(){
      const layers = [
        { el: document.querySelector('.layer-sky'), k: 0.01 },
        { el: document.querySelector('.layer-sea'), k: 0.03 },
        { el: document.querySelector('.layer-sand'), k: 0.05 },
        { el: document.querySelector('.layer-grass'), k: 0.07 },
        { el: document.querySelector('.trees'), k: 0.09 },
        { el: document.querySelector('.npc'), k: 0.12 }
      ];
      let w = window.innerWidth, h = window.innerHeight;
      function move(e){
        const x = (e.clientX - w/2)/w, y = (e.clientY - h/2)/h;
        layers.forEach(({el,k})=>{ if(!el) return; el.style.transform = `translate(${x*20*k}px, ${y*20*k}px)`; });
      }
      window.addEventListener('mousemove', move);
      window.addEventListener('resize', ()=>{ w=innerWidth; h=innerHeight; });
    })();

    // =========================
    // Flow helpers
    // =========================
    function choose(i){
      const node = DIALOGUE[current];
      if (!node.choices) return;
      const choice = node.choices[i];
      if (!choice) return;
      if (choice.next === 'no_song') setTimeout(sting, 100);
      pendingNext = choice.next;
      showNode('bleed');
    }

    function restart(){ showNode('start'); }

    // =========================
    // Boot
    // =========================
    showNode('start');
    initPetals();
  </script>
</body>
</html>
