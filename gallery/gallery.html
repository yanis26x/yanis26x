<!DOCTYPE html>

  <head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <body>
    <!-- Sang AU-DESSUS (même logique que tes autres pages) -->
    <img src="../OST_IMG/Sang2.png" alt="Sang overlay" class="bloodOnScreen"/>

        <header class="header">
          <div class="header-row">
            <div class="identity">
              <div class="avatar-wrap">

              </div>
              <div>
                <h1 class="title">Gallery</h1>
                <div class="handle">@yanis26x</div>
              </div>
            </div>

            <div class="actions">
              <a class="action-btn" href="../index.html" aria-label="Retour au menu">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="currentColor" d="M14.7 6.3a1 1 0 0 1 0 1.4L10.41 12l4.3 4.3a1 1 0 1 1-1.42 1.4l-5-5a1 1 0 0 1 0-1.4l5-5a1 1 0 0 1 1.42 0Z"/>

            <figure class="g-item" tabindex="0" data-desc="swagg">
              <img src="../OST_IMG/imageCool/fma.jpg" alt="fma">
              <figcaption>FullMetall</figcaption>
            </figure>

            <figure class="g-item" tabindex="0" data-desc="When them vamps outside, lil' bitch, you better be ready">
              <img src="../OST_IMG/imageCool/242.g.jpeg" alt="242">

            </figure>

        <!-- Footer -->
        <footer class="footer" role="contentinfo">
          <p class="footer-text">I NEED MORE BLOOD</p>
          <div class="footer-line" aria-hidden="true"></div>
          <p class="copyright">© 2025 <b>yanis26x</b> · Tous droits réservés</p>
        </footer>
      </div>
    </main>

    <!-- Lightbox / Modal -->
    <div class="lightbox" id="lightbox" aria-hidden="true">
      <div class="lb-backdrop" id="lbBackdrop"></div>
      <div class="lb-dialog" role="dialog" aria-modal="true" aria-labelledby="lbCaption">
        <button class="lb-close" id="lbClose" aria-label="Fermer">✕</button>
        <img id="lbImage" alt="">
        <div class="lb-caption">
          <div class="lb-title" id="lbTitle"></div>
          <div class="lb-desc" id="lbDesc"></div>
        </div>
        <div class="lb-nav">
          <button class="lb-prev" id="lbPrev" aria-label="Précédent">◀</button>
          <button class="lb-next" id="lbNext" aria-label="Suivant">▶</button>

    <script src="gallery.js"></script>
