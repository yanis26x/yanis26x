<script>
    function confirmer() {
        let inputText = document.querySelector(".input").value;
        let convertA = document.getElementById("convertA").checked; // Vérifie si la case est cochée
        let convertC = document.getElementById("convertC").checked; // Vérifie si la case est cochée

        let transformation = {
            'b': 'B',
             
              'd': 'D', 
              'e': '3',
            'f': 'F',
             'g': '6',
              'h': 'H',
               'i': '1',
                'j': 'J',
            'k': 'k',
             'l': 'L',
             'm': 'M',
             'n': 'N',
             'o': '0',
            'p': 'p',
             'q': 'q',
             'r': 'r',
             's': 'S',
             't': 'T',
            'u': 'u',
            'v': 'V',
            'w': 'w',
            'x': 'x',
            'y': 'y', 'z': 'z'
        };

        let transformedText = inputText.split('').map(char => {
            if (char.toLowerCase() === 'a') {
                return convertA ? '4' : 'a'; // Applique la transformation seulement si la case est cochée
            }
            if (char.toLowerCase() === 'c') {
                return convertC ? '(' : 'c'; // Applique la transformation seulement si la case est cochée
            }
            return transformation[char.toLowerCase()] || char;
        }).join('');

        document.getElementById("output").textContent = transformedText;
    }
</script>
