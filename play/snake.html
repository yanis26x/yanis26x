<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake · 26x</title>
  <link rel="icon" type="image/x-icon" href="../OST_IMG/26xLogo.png">
  <link rel="stylesheet" href="play.css">
  <style>
    canvas{ background:#0b0b0f; border:1px solid var(--border); border-radius:12px; display:block; margin:0 auto; box-shadow: var(--shadow); }
    .hud{ text-align:center; color:var(--sub); margin:10px 0 0 }
  </style>
</head>
<body>
  <img src="../OST_IMG/sang.png" class="bloodOnScreen" alt="">
  <main class="safe">
    <div class="wrap">
      <header class="header">
        <div class="header-row">
          <div class="identity">
            <div class="avatar-wrap">
              <img class="avatar" src="../OST_IMG/iconAPP/0SaKiICON.png" alt="Avatar">
              <span class="presence presence--online"></span>
            </div>
            <div>
              <h1 class="title">Snake</h1>
              <div class="handle">@yanis26x</div>
            </div>
          </div>
          <div class="actions">
            <a class="action-btn" href="play.html">
              <svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M14.7 6.3a1 1 0 0 1 0 1.4L10.41 12l4.3 4.3a1 1 0 1 1-1.42 1.4l-5-5a1 1 0 0 1 0-1.4l5-5a1 1 0 0 1 1.42 0Z"/></svg>
              <span>Retour</span>
            </a>
          </div>
        </div>
      </header>

      <section class="card in">
        <div class="section-head">
          <div class="section-row">
            <svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M7 11h7a3 3 0 0 1 0 6h-3a1 1 0 1 0 0 2h3a5 5 0 0 0 0-10H7a3 3 0 0 1 0-6h7a1 1 0 0 0 0-2H7a5 5 0 0 0 0 10Z"/></svg>
            <h2 class="section-title">Flèches pour jouer</h2>
          </div>
        </div>

        <canvas id="board" width="420" height="420"></canvas>
        <div class="hud"><span id="score">Score: 0</span></div>
      </section>
    </div>
  </main>

  <script>
    const cvs = document.getElementById('board');
    const ctx = cvs.getContext('2d');
    const size = 20; // grid
    const cells = cvs.width / size;

    let snake = [{x:10,y:10}];
    let dir = {x:1,y:0};
    let food = spawnFood();
    let score = 0;
    let dead = false;

    function spawnFood(){
      let f;
      do{
        f = { x: Math.floor(Math.random()*cells), y: Math.floor(Math.random()*cells) };
      }while(snake.some(s=>s.x===f.x && s.y===f.y));
      return f;
    }

    function step(){
      if (dead) return;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      // wrap edges
      head.x = (head.x + cells) % cells;
      head.y = (head.y + cells) % cells;

      // self-collide
      if (snake.some((s,i)=> i>0 && s.x===head.x && s.y===head.y)) {
        dead = true;
        document.getElementById('score').textContent = `Perdu. Score: ${score}. Appuie R pour rejouer.`;
        return;
      }

      snake.unshift(head);

      if (head.x===food.x && head.y===food.y){
        score++;
        document.getElementById('score').textContent = `Score: ${score}`;
        food = spawnFood();
      }else{
        snake.pop();
      }

      draw();
    }

    function draw(){
      ctx.clearRect(0,0,cvs.width,cvs.height);
      // grid bg
      ctx.fillStyle = "#0f0f14";
      ctx.fillRect(0,0,cvs.width,cvs.height);

      // food
      ctx.fillStyle = "#22c55e";
      ctx.fillRect(food.x*size, food.y*size, size, size);

      // snake
      ctx.fillStyle = "#7ab6ff";
      snake.forEach((s,i)=>{
        ctx.fillRect(s.x*size, s.y*size, size, size);
      });
    }

    document.addEventListener('keydown', (e)=>{
      if (e.key === 'ArrowUp'    && dir.y !== 1)  dir={x:0,y:-1};
      if (e.key === 'ArrowDown'  && dir.y !== -1) dir={x:0,y:1};
      if (e.key === 'ArrowLeft'  && dir.x !== 1)  dir={x:-1,y:0};
      if (e.key === 'ArrowRight' && dir.x !== -1) dir={x:1,y:0};
      if (dead && (e.key==='r' || e.key==='R')){
        snake = [{x:10,y:10}]; dir={x:1,y:0}; food=spawnFood(); score=0; dead=false;
        document.getElementById('score').textContent = `Score: ${score}`;
        draw();
      }
    });

    draw();
    setInterval(step, 120);
  </script>
</body>
</html>
